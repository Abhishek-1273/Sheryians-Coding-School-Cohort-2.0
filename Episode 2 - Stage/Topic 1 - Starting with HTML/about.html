<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Page - Page Navigation Demo | Sheryians Cohort 2.0</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 3rem 2rem;
            border-radius: 12px;
            max-width: 500px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        p {
            color: #cbd5e1;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            margin-top: 1.5rem;
            background-color: #0369a1;
            color: #ffffff;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        a:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>👋 Welcome to the About Page!</h1>
        <p>Yeh page demonstrate karta hai ki kaise <code>&lt;a href="about.html"&gt;</code> ke through aap alag-alag pages ke beech navigate kar sakte ho.</p>
        <p>Current Page: <strong>about.html</strong></p>
        <a href="index.html">&larr; Back to Home (index.html)</a>
    </div>

</body>
</html>
